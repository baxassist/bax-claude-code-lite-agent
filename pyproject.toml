# Только для тестов: сам плагин зависимости берёт при запуске (`uv run --with …` в .mcp.json).
# Диапазоны — те же, что там: канал опирается на внутренности mcp, и новая мажорная
# версия могла бы его молча сломать
[project]
name = "bax-claude-code-lite-agent"
version = "0.3.6"
description = "Claude Code Lite: канал Бакса внутри открытой сессии Claude Code"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "mcp==2.2.0",
    "websockets==17.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
